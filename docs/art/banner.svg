<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d">
<title id="t">Rust Server Control</title>
<desc id="d">A server rack with blinking status lights next to a console window with scrolling log lines.</desc>
<defs>
  <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#64D2FF"/><stop offset=".35" stop-color="#2E9BFF"/><stop offset=".7" stop-color="#5E5CE6"/><stop offset="1" stop-color="#E28CFF"/>
  </linearGradient>
  <linearGradient id="prog" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#0A84FF"/><stop offset=".6" stop-color="#5E5CE6"/><stop offset="1" stop-color="#E28CFF"/>
  </linearGradient>
  <radialGradient id="gb"><stop offset="0" stop-color="#0A84FF" stop-opacity=".45"/><stop offset="1" stop-color="#0A84FF" stop-opacity="0"/></radialGradient>
  <radialGradient id="gi"><stop offset="0" stop-color="#5E5CE6" stop-opacity=".42"/><stop offset="1" stop-color="#5E5CE6" stop-opacity="0"/></radialGradient>
  <radialGradient id="gp"><stop offset="0" stop-color="#BF5AF2" stop-opacity=".32"/><stop offset="1" stop-color="#BF5AF2" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".04"/></pattern>
  <clipPath id="frame"><rect width="1200" height="320" rx="26"/></clipPath>
  <clipPath id="logclip"><rect x="880" y="90" width="270" height="132"/></clipPath>
</defs>
<style>
  .glow{animation:drift 16s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
  .g2{animation-duration:20s;animation-direction:alternate-reverse}
  .g3{animation-duration:24s}
  @keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(60px,24px) scale(1.15)}}
  .led{animation:blink 2.4s steps(1) infinite}
  .l2{animation-delay:-.7s}.l3{animation-delay:-1.3s}.l4{animation-delay:-1.9s}.l5{animation-duration:1.1s}.l6{animation-duration:3.3s;animation-delay:-.4s}
  @keyframes blink{0%,100%{opacity:1}40%{opacity:.25}55%{opacity:1}}
  .act{transform-box:fill-box;transform-origin:left center;animation:act 1.8s ease-in-out infinite}
  .a2{animation-delay:-.6s}.a3{animation-delay:-1.2s}.a4{animation-delay:-.3s}
  @keyframes act{0%,100%{transform:scaleX(.15)}50%{transform:scaleX(1)}}
  .wave{opacity:0;animation:wave 3s ease-out infinite}
  .w2{animation-delay:.5s}.w3{animation-delay:1s}
  @keyframes wave{0%{opacity:0}25%{opacity:.9}70%,100%{opacity:0}}
  .log{animation:scroll 16s linear infinite}
  @keyframes scroll{from{transform:translateY(0)}to{transform:translateY(-144px)}}
  .caret{animation:caret 1.06s steps(1) infinite}
  @keyframes caret{0%,50%{opacity:1}50.01%,100%{opacity:0}}
  .line{stroke-dasharray:14 10;animation:flow 2.2s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-48}}
  .dot{animation:ping 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes ping{0%{transform:scale(1);opacity:.8}80%,100%{transform:scale(3.2);opacity:0}}
  text{font-family:"Segoe UI",Inter,Arial,sans-serif}
  .mono{font-family:"Cascadia Mono",Consolas,"Courier New",monospace}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.wave{opacity:.6}}
</style>
<g clip-path="url(#frame)">
  <rect width="1200" height="320" fill="#141418"/>
  <circle class="glow" cx="180" cy="40" r="300" fill="url(#gb)"/>
  <circle class="glow g2" cx="720" cy="330" r="320" fill="url(#gi)"/>
  <circle class="glow g3" cx="1110" cy="30" r="260" fill="url(#gp)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <!-- signal waves -->
  <g fill="none" stroke="#64D2FF" stroke-width="3" stroke-linecap="round">
    <path class="wave" d="M153 44a14 14 0 0 1 24 0"/>
    <path class="wave w2" d="M144 36a26 26 0 0 1 42 0"/>
    <path class="wave w3" d="M135 28a38 38 0 0 1 60 0"/>
  </g>

  <!-- rack -->
  <rect x="70" y="56" width="190" height="214" rx="16" fill="#1c1c22" stroke="#fff" stroke-opacity=".12"/>
  <rect x="70" y="56" width="190" height="214" rx="16" fill="none" stroke="url(#prog)" stroke-opacity=".5"/>
  <g>
    <rect x="84" y="70" width="162" height="40" rx="8" fill="#fff" fill-opacity=".055" stroke="#fff" stroke-opacity=".09"/>
    <circle class="led" cx="100" cy="90" r="4.5" fill="#30D158"/>
    <circle class="led l5" cx="115" cy="90" r="4.5" fill="#0A84FF"/>
    <path d="M132 84h56M132 90h56M132 96h56" stroke="#fff" stroke-opacity=".14" stroke-width="2"/>
    <rect x="200" y="88" width="34" height="4" rx="2" fill="#fff" fill-opacity=".08"/>
    <rect class="act" x="200" y="88" width="34" height="4" rx="2" fill="url(#prog)"/>
  </g>
  <g>
    <rect x="84" y="118" width="162" height="40" rx="8" fill="#fff" fill-opacity=".055" stroke="#fff" stroke-opacity=".09"/>
    <circle class="led l2" cx="100" cy="138" r="4.5" fill="#30D158"/>
    <circle class="led l6" cx="115" cy="138" r="4.5" fill="#FF9F0A"/>
    <path d="M132 132h56M132 138h56M132 144h56" stroke="#fff" stroke-opacity=".14" stroke-width="2"/>
    <rect x="200" y="136" width="34" height="4" rx="2" fill="#fff" fill-opacity=".08"/>
    <rect class="act a2" x="200" y="136" width="34" height="4" rx="2" fill="url(#prog)"/>
  </g>
  <g>
    <rect x="84" y="166" width="162" height="40" rx="8" fill="#fff" fill-opacity=".055" stroke="#fff" stroke-opacity=".09"/>
    <circle class="led l3" cx="100" cy="186" r="4.5" fill="#30D158"/>
    <circle class="led l5" cx="115" cy="186" r="4.5" fill="#64D2FF"/>
    <path d="M132 180h56M132 186h56M132 192h56" stroke="#fff" stroke-opacity=".14" stroke-width="2"/>
    <rect x="200" y="184" width="34" height="4" rx="2" fill="#fff" fill-opacity=".08"/>
    <rect class="act a3" x="200" y="184" width="34" height="4" rx="2" fill="url(#prog)"/>
  </g>
  <g>
    <rect x="84" y="214" width="162" height="40" rx="8" fill="#fff" fill-opacity=".055" stroke="#fff" stroke-opacity=".09"/>
    <circle class="led l4" cx="100" cy="234" r="4.5" fill="#30D158"/>
    <circle class="led l6" cx="115" cy="234" r="4.5" fill="#BF5AF2"/>
    <path d="M132 228h56M132 234h56M132 240h56" stroke="#fff" stroke-opacity=".14" stroke-width="2"/>
    <rect x="200" y="232" width="34" height="4" rx="2" fill="#fff" fill-opacity=".08"/>
    <rect class="act a4" x="200" y="232" width="34" height="4" rx="2" fill="url(#prog)"/>
  </g>

  <!-- title -->
  <g>
    <circle cx="318" cy="98" r="5" fill="#30D158"/>
    <circle class="dot" cx="318" cy="98" r="5" fill="#30D158"/>
    <text x="332" y="103" font-size="14" font-weight="600" fill="#F5F5F7" fill-opacity=".62" letter-spacing="1.5">SERVER ONLINE  ·  v1.0.0</text>
    <text x="308" y="160" font-size="50" font-weight="800" fill="url(#acc)" letter-spacing="-1.5">Rust Server Control</text>
    <text x="310" y="198" font-size="19" fill="#EBEBF5" fill-opacity=".72">Install, run and manage a Rust server on Windows.</text>
    <text x="310" y="232" font-size="14" class="mono" fill="#64D2FF" fill-opacity=".85">one exe  ·  vanilla / carbon / oxide  ·  win 10 and 11</text>
  </g>

  <!-- console -->
  <rect x="880" y="56" width="270" height="214" rx="14" fill="#1b1b21" stroke="#fff" stroke-opacity=".12"/>
  <path d="M880 82h270" stroke="#fff" stroke-opacity=".09"/>
  <text x="894" y="74" font-size="11" fill="#EBEBF5" fill-opacity=".5" class="mono">console</text>
  <path d="M1102 69h8M1118 65h8v8h-8zM1134 65l8 8M1142 65l-8 8" stroke="#EBEBF5" stroke-opacity=".4" fill="none"/>
  <g clip-path="url(#logclip)">
    <g class="log mono" font-size="11">
      <g id="lines">
        <text x="894" y="106" fill="#64D2FF">[steamcmd] update complete</text>
        <text x="894" y="124" fill="#EBEBF5" fill-opacity=".62">loading carbon framework</text>
        <text x="894" y="142" fill="#30D158">plugins loaded: 24</text>
        <text x="894" y="160" fill="#EBEBF5" fill-opacity=".62">rcon on 127.0.0.1</text>
        <text x="894" y="178" fill="#30D158">server startup complete</text>
        <text x="894" y="196" fill="#BF5AF2">player joined (12/100)</text>
        <text x="894" y="214" fill="#FF9F0A">saving 41203 entities</text>
        <text x="894" y="232" fill="#EBEBF5" fill-opacity=".62">backup written</text>
      </g>
      <use href="#lines" y="144"/>
    </g>
  </g>
  <rect x="890" y="232" width="250" height="28" rx="7" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".09"/>
  <text x="900" y="250" font-size="12" class="mono" fill="#0A84FF">&gt;</text>
  <text x="914" y="250" font-size="12" class="mono" fill="#F5F5F7">server.save</text>
  <rect class="caret" x="996" y="240" width="7" height="13" rx="1" fill="#F5F5F7"/>

  <!-- flowing line -->
  <path class="line" d="M0 296c100-14 200 14 300 0s200-14 300 0 200 14 300 0 200-14 300 0" fill="none" stroke="url(#prog)" stroke-width="3" stroke-linecap="round" stroke-opacity=".75"/>
</g>
<rect x=".5" y=".5" width="1199" height="319" rx="25.5" fill="none" stroke="#fff" stroke-opacity=".08"/>
</svg>
