<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" role="img" aria-labelledby="t">
<title id="t">A wipe calendar with the first Thursday circled and a clock counting down to the scheduled wipe</title>
<defs>
  <linearGradient id="prog" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0A84FF"/><stop offset=".6" stop-color="#5E5CE6"/><stop offset="1" stop-color="#E28CFF"/></linearGradient>
  <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFB340"/><stop offset="1" stop-color="#FF7A00"/></linearGradient>
  <radialGradient id="halo"><stop offset="0" stop-color="#FF9F0A" stop-opacity=".2"/><stop offset="1" stop-color="#FF9F0A" stop-opacity="0"/></radialGradient>
</defs>
<style>
  text{font-family:"Segoe UI",Inter,Arial,sans-serif}
  .nums text{font-size:12px;fill:#EBEBF5;fill-opacity:.62;text-anchor:middle}
  .nums .th{fill:#F5F5F7;fill-opacity:1;font-weight:600}
  .nums .we{fill-opacity:.38}
  .wd text{font-size:10.5px;font-weight:700;fill:#EBEBF5;fill-opacity:.38;text-anchor:middle}
  .circ{stroke-dasharray:110;stroke-dashoffset:110;animation:draw 6s ease-in-out infinite}
  @keyframes draw{0%,8%{stroke-dashoffset:110}30%,85%{stroke-dashoffset:0}95%,100%{stroke-dashoffset:110;opacity:0}}
  .min{transform-origin:378px 150px;animation:spin 6s linear infinite}
  .hr{transform-origin:378px 150px;animation:spin 72s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .bar{transform-box:fill-box;transform-origin:left center;animation:bar 6s ease-in-out infinite}
  @keyframes bar{0%{transform:scaleX(.08)}90%{transform:scaleX(1)}100%{transform:scaleX(.08)}}
  .tag{animation:tag 6s ease infinite;transform-box:fill-box;transform-origin:center}
  @keyframes tag{0%,26%{opacity:0;transform:translateY(6px)}34%,86%{opacity:1;transform:none}96%,100%{opacity:0}}
  .pulse{animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.circ{stroke-dashoffset:0}.tag{opacity:1}.hr{transform:rotate(130deg)}}
</style>
<circle cx="378" cy="150" r="150" fill="url(#halo)"/>

<!-- calendar -->
<rect x="30" y="44" width="264" height="246" rx="16" fill="#1f1f26" stroke="#fff" stroke-opacity=".14"/>
<rect x="30" y="44" width="264" height="40" rx="16" fill="#fff" fill-opacity=".04"/>
<text x="48" y="70" font-size="14" font-weight="700" fill="#F5F5F7">November</text>
<rect x="226" y="56" width="54" height="20" rx="7" fill="url(#acc)"/>
<text x="253" y="70" font-size="10.5" font-weight="800" fill="#fff" text-anchor="middle" letter-spacing=".8">WIPES</text>
<rect x="149" y="92" width="32" height="186" rx="9" fill="#FF9F0A" fill-opacity=".1"/>
<g class="wd"><text x="63" y="106">M</text><text x="97" y="106">T</text><text x="131" y="106">W</text><text x="165" y="106">T</text><text x="199" y="106">F</text><text x="233" y="106">S</text><text x="267" y="106">S</text></g>
<g class="nums">
    <text x="267" y="132" class="we">1</text>
    <text x="63" y="158">2</text>
    <text x="97" y="158">3</text>
    <text x="131" y="158">4</text>
    <text x="165" y="158" class="th">5</text>
    <text x="199" y="158">6</text>
    <text x="233" y="158" class="we">7</text>
    <text x="267" y="158" class="we">8</text>
    <text x="63" y="184">9</text>
    <text x="97" y="184">10</text>
    <text x="131" y="184">11</text>
    <text x="165" y="184" class="th">12</text>
    <text x="199" y="184">13</text>
    <text x="233" y="184" class="we">14</text>
    <text x="267" y="184" class="we">15</text>
    <text x="63" y="210">16</text>
    <text x="97" y="210">17</text>
    <text x="131" y="210">18</text>
    <text x="165" y="210" class="th">19</text>
    <text x="199" y="210">20</text>
    <text x="233" y="210" class="we">21</text>
    <text x="267" y="210" class="we">22</text>
    <text x="63" y="236">23</text>
    <text x="97" y="236">24</text>
    <text x="131" y="236">25</text>
    <text x="165" y="236" class="th">26</text>
    <text x="199" y="236">27</text>
    <text x="233" y="236" class="we">28</text>
    <text x="267" y="236" class="we">29</text>
    <text x="63" y="262">30</text>
</g>
<circle class="circ" cx="165" cy="154" r="16" fill="none" stroke="#FF9F0A" stroke-width="2.5" stroke-linecap="round" transform="rotate(-90 165 154)"/>
<circle class="pulse" cx="165" cy="210" r="2.5" fill="#FF9F0A" transform="translate(0 6)"/>

<!-- clock -->
<circle cx="378" cy="150" r="74" fill="#1f1f26" stroke="#fff" stroke-opacity=".14"/>
<path d="M378 82a68 68 0 0 1 58.9 34" fill="none" stroke="url(#acc)" stroke-width="6" stroke-linecap="round" opacity=".85"/>
<g stroke="#EBEBF5" stroke-opacity=".45" stroke-width="2" stroke-linecap="round"><path d="M378 84v10" transform="rotate(0 378 150)"/><path d="M378 84v6" transform="rotate(30 378 150)"/><path d="M378 84v6" transform="rotate(60 378 150)"/><path d="M378 84v10" transform="rotate(90 378 150)"/><path d="M378 84v6" transform="rotate(120 378 150)"/><path d="M378 84v6" transform="rotate(150 378 150)"/><path d="M378 84v10" transform="rotate(180 378 150)"/><path d="M378 84v6" transform="rotate(210 378 150)"/><path d="M378 84v6" transform="rotate(240 378 150)"/><path d="M378 84v10" transform="rotate(270 378 150)"/><path d="M378 84v6" transform="rotate(300 378 150)"/><path d="M378 84v6" transform="rotate(330 378 150)"/></g>
<path class="hr" d="M378 150V114" stroke="#F5F5F7" stroke-width="5" stroke-linecap="round"/>
<path class="min" d="M378 150V96" stroke="url(#prog)" stroke-width="3" stroke-linecap="round"/>
<circle cx="378" cy="150" r="5" fill="#F5F5F7"/>

<!-- countdown -->
<g class="tag">
  <rect x="310" y="240" width="140" height="44" rx="10" fill="#26262e" stroke="#fff" stroke-opacity=".14"/>
  <text x="324" y="258" font-size="10" font-weight="700" fill="#EBEBF5" fill-opacity=".45" letter-spacing=".8">NEXT WIPE</text>
  <text x="324" y="275" font-size="13" font-weight="700" fill="#F5F5F7">Thu 5 Nov, 19:00</text>
</g>
<rect x="310" y="292" width="140" height="4" rx="2" fill="#fff" fill-opacity=".08"/>
<rect class="bar" x="310" y="292" width="140" height="4" rx="2" fill="url(#prog)"/>
</svg>
