<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" role="img" aria-labelledby="t">
<title id="t">Rust Server Control</title>
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#0A84FF"/><stop offset=".55" stop-color="#5E5CE6"/><stop offset="1" stop-color="#BF5AF2"/>
  </linearGradient>
  <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff"/></linearGradient>
  <mask id="m1" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="150"><path class="w1" d="M0 70 q100.0 -22 200.0 0 t200.0 0 t200.0 0 t200.0 0 t200.0 0 t200.0 0 t200.0 0 t200.0 0 V150 H0 Z" fill="#fff" fill-opacity=".35"/></mask>
  <mask id="m2" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="150"><path class="w2" d="M0 90 q75.0 -18 150.0 0 t150.0 0 t150.0 0 t150.0 0 t150.0 0 t150.0 0 t150.0 0 t150.0 0 t150.0 0 t150.0 0 t150.0 0 t150.0 0 V150 H0 Z" fill="#fff" fill-opacity=".6"/></mask>
  <mask id="m3" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="150"><path class="w3" d="M0 110 q150.0 -14 300.0 0 t300.0 0 t300.0 0 t300.0 0 t300.0 0 t300.0 0 V150 H0 Z" fill="#fff"/></mask>
</defs>
<style>
  .w1{animation:w1 14s linear infinite}
  .w2{animation:w2 10s linear infinite}
  .w3{animation:w3 18s linear infinite}
  @keyframes w1{to{transform:translateX(-400px)}}
  @keyframes w2{from{transform:translateX(-300px)}to{transform:translateX(0)}}
  @keyframes w3{to{transform:translateX(-600px)}}
  .led{animation:blink 2.4s steps(1) infinite}
  .l2{animation-delay:-.8s}.l3{animation-delay:-1.6s}
  @keyframes blink{0%,100%{opacity:1}45%{opacity:.3}60%{opacity:1}}
  text{font-family:"Segoe UI",Inter,Arial,sans-serif}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1200" height="150" fill="url(#g)" mask="url(#m1)"/>
<rect width="1200" height="150" fill="url(#g)" mask="url(#m2)"/>
<rect width="1200" height="150" fill="url(#g)" mask="url(#m3)"/>
<g transform="translate(600 132)">
  <circle class="led" cx="-16" cy="0" r="3.5" fill="#30D158"/>
  <circle class="led l2" cx="0" cy="0" r="3.5" fill="#fff"/>
  <circle class="led l3" cx="16" cy="0" r="3.5" fill="#64D2FF"/>
</g>
</svg>
