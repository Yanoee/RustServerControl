<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" role="img" aria-labelledby="t">
<title id="t">A radar sweeping over player blips next to an online players list</title>
<defs>
  <radialGradient id="disc"><stop offset="0" stop-color="#30D158" stop-opacity=".14"/><stop offset="1" stop-color="#30D158" stop-opacity=".02"/></radialGradient>
  <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#30D158" stop-opacity="0"/><stop offset="1" stop-color="#30D158" stop-opacity=".5"/></linearGradient>
  <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2E9BFF"/><stop offset="1" stop-color="#5E5CE6"/></linearGradient>
  <clipPath id="rc"><circle cx="150" cy="160" r="122"/></clipPath>
</defs>
<style>
  text{font-family:"Segoe UI",Inter,Arial,sans-serif}
  .rot{transform-origin:150px 160px;animation:spin 4s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .blip{transform-box:fill-box;transform-origin:center;animation:blip 4s ease-out infinite}
  @keyframes blip{0%{opacity:1;transform:scale(1.5)}12%{transform:scale(1)}70%{opacity:.25}100%{opacity:.25;transform:scale(1)}}
  .p1{animation-delay:-3.71s}.p2{animation-delay:-3.06s}.p3{animation-delay:-2.39s}.p4{animation-delay:-1.34s}.p5{animation-delay:-.44s}
  .row{animation:row 6s ease-in-out infinite}
  @keyframes row{0%,28%{transform:translateY(0)}34%,62%{transform:translateY(40px)}68%,94%{transform:translateY(80px)}100%{transform:translateY(0)}}
  .bub{animation:bub 6s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom left}
  @keyframes bub{0%,10%{opacity:0;transform:scale(.8)}16%,80%{opacity:1;transform:none}88%,100%{opacity:0;transform:scale(.9)}}
  .float{animation:float 6s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.blip{opacity:.9}.rot{transform:rotate(40deg)}}
</style>

<!-- radar -->
<circle cx="150" cy="160" r="122" fill="url(#disc)" stroke="#30D158" stroke-opacity=".35"/>
<g fill="none" stroke="#30D158" stroke-opacity=".18">
  <circle cx="150" cy="160" r="90"/><circle cx="150" cy="160" r="58"/><circle cx="150" cy="160" r="26"/>
  <path d="M28 160h244M150 38v244"/>
</g>
<g clip-path="url(#rc)">
  <g class="rot">
    <path d="M150 160L150 38A122 122 0 0 0 71.6 66.5Z" fill="url(#sweep)"/>
    <path d="M150 160V38" stroke="#30D158" stroke-width="2" stroke-opacity=".9"/>
  </g>
</g>
<g fill="#30D158">
  <circle class="blip p1" cx="185" cy="88" r="5"/>
  <circle class="blip p2" cx="236" cy="152" r="5"/>
  <circle class="blip p3" cx="196" cy="226" r="5"/>
  <circle class="blip p4" cx="88" cy="196" r="5" fill="#FF9F0A"/>
  <circle class="blip p5" cx="104" cy="104" r="5"/>
</g>
<circle cx="150" cy="160" r="5" fill="#64D2FF"/>
<circle cx="150" cy="160" r="10" fill="none" stroke="#64D2FF" stroke-opacity=".5"/>

<!-- players card -->
<g class="float">
  <rect x="296" y="62" width="172" height="196" rx="14" fill="#1f1f26" stroke="#fff" stroke-opacity=".14"/>
  <text x="312" y="88" font-size="13" font-weight="700" fill="#F5F5F7">Players</text>
  <rect x="400" y="75" width="54" height="18" rx="6" fill="#30D158" fill-opacity=".18"/>
  <text x="427" y="88" font-size="10.5" font-weight="700" fill="#30D158" text-anchor="middle">3 online</text>
  <path d="M296 102h172" stroke="#fff" stroke-opacity=".08"/>
  <rect class="row" x="304" y="110" width="156" height="36" rx="8" fill="#0A84FF" fill-opacity=".2"/>
  <g font-size="12.5">
    <circle cx="324" cy="128" r="10" fill="url(#acc)"/><text x="324" y="132.5" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">H</text>
    <text x="342" y="132" fill="#F5F5F7">Hamster</text>
    <circle cx="324" cy="168" r="10" fill="#BF5AF2"/><text x="324" y="172.5" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">S</text>
    <text x="342" y="172" fill="#F5F5F7">Badger</text>
    <circle cx="324" cy="208" r="10" fill="#FF9F0A"/><text x="324" y="212.5" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">N</text>
    <text x="342" y="212" fill="#F5F5F7">nakedbob</text>
  </g>
  <g fill="#30D158">
    <rect x="428" y="128" width="3" height="6" rx="1"/><rect x="433" y="125" width="3" height="9" rx="1"/><rect x="438" y="122" width="3" height="12" rx="1"/><rect x="443" y="119" width="3" height="15" rx="1"/>
    <rect x="428" y="168" width="3" height="6" rx="1"/><rect x="433" y="165" width="3" height="9" rx="1"/><rect x="438" y="162" width="3" height="12" rx="1"/><rect x="443" y="159" width="3" height="15" rx="1" fill-opacity=".25"/>
    <rect x="428" y="208" width="3" height="6" rx="1" fill="#FF9F0A"/><rect x="433" y="205" width="3" height="9" rx="1" fill="#FF9F0A"/><rect x="438" y="202" width="3" height="12" rx="1" fill-opacity=".25"/><rect x="443" y="199" width="3" height="15" rx="1" fill-opacity=".25"/>
  </g>
  <rect x="312" y="230" width="66" height="18" rx="6" fill="#fff" fill-opacity=".07"/>
  <text x="345" y="243" font-size="10.5" font-weight="600" fill="#EBEBF5" fill-opacity=".7" text-anchor="middle">Kick</text>
  <rect x="384" y="230" width="66" height="18" rx="6" fill="#FF453A" fill-opacity=".2"/>
  <text x="417" y="243" font-size="10.5" font-weight="700" fill="#FF453A" text-anchor="middle">Ban</text>
</g>

<!-- chat bubble -->
<g class="bub">
  <path d="M232 260h96a10 10 0 0 1 10 10v14a10 10 0 0 1-10 10h-84l-14 10 4-10h-2a10 10 0 0 1-10-10v-14a10 10 0 0 1 10-10z" fill="#26262e" stroke="#BF5AF2" stroke-opacity=".6"/>
  <text x="236" y="282" font-size="11.5" fill="#F5F5F7"><tspan fill="#BF5AF2" font-weight="700">Badger:</tspan> gg</text>
</g>
</svg>
