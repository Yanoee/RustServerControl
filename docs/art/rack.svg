<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" width="480" height="400" role="img" aria-labelledby="t">
<title id="t">A server rack with a live performance graph and an online status pill</title>
<defs>
  <linearGradient id="prog" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0A84FF"/><stop offset=".6" stop-color="#5E5CE6"/><stop offset="1" stop-color="#E28CFF"/></linearGradient>
  <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2E9BFF"/><stop offset="1" stop-color="#5E5CE6"/></linearGradient>
  <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5E5CE6" stop-opacity=".45"/><stop offset="1" stop-color="#5E5CE6" stop-opacity="0"/></linearGradient>
  <radialGradient id="halo"><stop offset="0" stop-color="#0A84FF" stop-opacity=".35"/><stop offset="1" stop-color="#0A84FF" stop-opacity="0"/></radialGradient>
  <g id="unit">
    <rect width="168" height="44" rx="9" fill="#fff" fill-opacity=".055" stroke="#fff" stroke-opacity=".1"/>
    <rect x="14" y="14" width="44" height="16" rx="4" fill="#000" fill-opacity=".35"/>
    <path d="M72 16v12M80 16v12M88 16v12M96 16v12M104 16v12M112 16v12" stroke="#fff" stroke-opacity=".13" stroke-width="3" stroke-linecap="round"/>
  </g>
</defs>
<style>
  .halo{animation:breathe 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes breathe{0%,100%{transform:scale(.92);opacity:.8}50%{transform:scale(1.06);opacity:1}}
  .led{animation:blink 2.2s steps(1) infinite}
  .d1{animation-delay:-.5s}.d2{animation-delay:-1.1s}.d3{animation-delay:-1.6s}.d4{animation-duration:1.2s}.d5{animation-duration:3.1s}
  @keyframes blink{0%,100%{opacity:1}45%{opacity:.22}60%{opacity:1}}
  .bar{transform-box:fill-box;transform-origin:left center;animation:bar 2.6s ease-in-out infinite}
  .b1{animation-delay:-.8s}.b2{animation-delay:-1.5s}.b3{animation-delay:-.3s}.b4{animation-delay:-2s}
  @keyframes bar{0%,100%{transform:scaleX(.2)}50%{transform:scaleX(1)}}
  .float{animation:float 6s ease-in-out infinite}
  .f2{animation-delay:-3s}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .graph{stroke-dasharray:420;stroke-dashoffset:420;animation:draw 5s ease-in-out infinite}
  @keyframes draw{0%{stroke-dashoffset:420}55%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:-420}}
  .fill{animation:fade 5s ease-in-out infinite}
  @keyframes fade{0%,20%{opacity:0}55%,85%{opacity:1}100%{opacity:0}}
  .ping{animation:ping 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes ping{0%{transform:scale(1);opacity:.8}80%,100%{transform:scale(3);opacity:0}}
  .cable{stroke-dasharray:6 8;animation:flow 1.6s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-28}}
  text{font-family:"Segoe UI",Inter,Arial,sans-serif}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.graph{stroke-dashoffset:0}.fill{opacity:1}}
</style>
<circle class="halo" cx="200" cy="210" r="190" fill="url(#halo)"/>

<!-- cables -->
<path class="cable" d="M292 120c40 0 40-40 80-40" fill="none" stroke="#64D2FF" stroke-opacity=".6" stroke-width="2.5" stroke-linecap="round"/>
<path class="cable" d="M292 290c40 0 50 30 90 30" fill="none" stroke="#BF5AF2" stroke-opacity=".6" stroke-width="2.5" stroke-linecap="round"/>

<!-- rack -->
<rect x="104" y="58" width="196" height="300" rx="18" fill="#1c1c22" stroke="#fff" stroke-opacity=".12"/>
<rect x="104" y="58" width="196" height="300" rx="18" fill="none" stroke="url(#prog)" stroke-opacity=".45"/>
<rect x="104" y="58" width="196" height="300" rx="18" fill="none" stroke="#fff" stroke-opacity=".18" stroke-dasharray="0 6 160 900"/>
<g>
  <use href="#unit" x="118" y="74"/><use href="#unit" x="118" y="130"/><use href="#unit" x="118" y="186"/><use href="#unit" x="118" y="242"/><use href="#unit" x="118" y="298"/>
  <circle class="led" cx="140" cy="96" r="4" fill="#30D158"/><circle class="led d4" cx="152" cy="96" r="4" fill="#0A84FF"/>
  <circle class="led d1" cx="140" cy="152" r="4" fill="#30D158"/><circle class="led d5" cx="152" cy="152" r="4" fill="#FF9F0A"/>
  <circle class="led d2" cx="140" cy="208" r="4" fill="#30D158"/><circle class="led d4" cx="152" cy="208" r="4" fill="#64D2FF"/>
  <circle class="led d3" cx="140" cy="264" r="4" fill="#30D158"/><circle class="led d5" cx="152" cy="264" r="4" fill="#BF5AF2"/>
  <circle class="led d1" cx="140" cy="320" r="4" fill="#30D158"/><circle class="led" cx="152" cy="320" r="4" fill="#FF375F"/>
  <rect x="242" y="94" width="30" height="4" rx="2" fill="#fff" fill-opacity=".08"/><rect class="bar" x="242" y="94" width="30" height="4" rx="2" fill="url(#prog)"/>
  <rect x="242" y="150" width="30" height="4" rx="2" fill="#fff" fill-opacity=".08"/><rect class="bar b1" x="242" y="150" width="30" height="4" rx="2" fill="url(#prog)"/>
  <rect x="242" y="206" width="30" height="4" rx="2" fill="#fff" fill-opacity=".08"/><rect class="bar b2" x="242" y="206" width="30" height="4" rx="2" fill="url(#prog)"/>
  <rect x="242" y="262" width="30" height="4" rx="2" fill="#fff" fill-opacity=".08"/><rect class="bar b3" x="242" y="262" width="30" height="4" rx="2" fill="url(#prog)"/>
  <rect x="242" y="318" width="30" height="4" rx="2" fill="#fff" fill-opacity=".08"/><rect class="bar b4" x="242" y="318" width="30" height="4" rx="2" fill="url(#prog)"/>
</g>
<rect x="132" y="358" width="20" height="12" rx="3" fill="#1c1c22" stroke="#fff" stroke-opacity=".1"/>
<rect x="252" y="358" width="20" height="12" rx="3" fill="#1c1c22" stroke="#fff" stroke-opacity=".1"/>

<!-- graph card -->
<g class="float">
  <rect x="314" y="36" width="150" height="96" rx="14" fill="#232329" stroke="#fff" stroke-opacity=".14"/>
  <text x="328" y="58" font-size="11" font-weight="600" fill="#EBEBF5" fill-opacity=".55" letter-spacing="1">SERVER FPS</text>
  <path d="M328 72h122M328 92h122M328 112h122" stroke="#fff" stroke-opacity=".05"/>
  <path class="fill" d="M328 110l14-8 14 4 14-18 14 6 14-14 14 8 14-12 20-6V120H328z" fill="url(#area)"/>
  <path class="graph" d="M328 110l14-8 14 4 14-18 14 6 14-14 14 8 14-12 20-6" fill="none" stroke="url(#prog)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- status pill -->
<g class="float f2">
  <rect x="330" y="290" width="138" height="40" rx="10" fill="#232329" stroke="#fff" stroke-opacity=".14"/>
  <circle cx="350" cy="310" r="5" fill="#30D158"/>
  <circle class="ping" cx="350" cy="310" r="5" fill="#30D158"/>
  <text x="364" y="315" font-size="14" font-weight="600" fill="#F5F5F7">Online</text>
  <rect x="418" y="301" width="38" height="18" rx="6" fill="url(#acc)"/>
  <text x="437" y="314" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">RCON</text>
</g>

<!-- player chip -->
<g class="float">
  <rect x="16" y="168" width="104" height="40" rx="10" fill="#232329" stroke="#fff" stroke-opacity=".14"/>
  <circle cx="36" cy="188" r="9" fill="#30D158" fill-opacity=".2" stroke="#30D158"/>
  <circle cx="36" cy="185" r="3" fill="#30D158"/><path d="M30 194a6 5 0 0 1 12 0" fill="#30D158"/>
  <text x="52" y="193" font-size="14" font-weight="700" fill="#F5F5F7">42<tspan fill="#EBEBF5" fill-opacity=".45" font-weight="500">/100</tspan></text>
</g>
</svg>
