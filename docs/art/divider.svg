<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 60" width="1200" height="60" preserveAspectRatio="none" aria-hidden="true">
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#0A84FF" stop-opacity="0"/><stop offset=".18" stop-color="#0A84FF"/><stop offset=".55" stop-color="#5E5CE6"/><stop offset=".82" stop-color="#E28CFF"/><stop offset="1" stop-color="#E28CFF" stop-opacity="0"/>
  </linearGradient>
  <mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="60">
    <g fill="none" stroke="#fff" stroke-linecap="round">
      <path class="a" d="M0 30 q75.0 -14 150.0 0 t150.0 0 t150.0 0 t150.0 0 t150.0 0 t150.0 0 t150.0 0 t150.0 0 t150.0 0 t150.0 0 t150.0 0 t150.0 0" stroke-width="2.5"/>
      <path class="b" d="M0 30 q50.0 -9 100.0 0 t100.0 0 t100.0 0 t100.0 0 t100.0 0 t100.0 0 t100.0 0 t100.0 0 t100.0 0 t100.0 0 t100.0 0 t100.0 0 t100.0 0 t100.0 0 t100.0 0 t100.0 0 t100.0 0 t100.0 0" stroke-width="1.5" stroke-opacity=".5"/>
    </g>
    <g fill="#fff"><circle class="p" cx="600" cy="30" r="3.5"/></g>
  </mask>
</defs>
<style>
  .a{animation:a 9s linear infinite}
  .b{animation:b 7s linear infinite}
  @keyframes a{to{transform:translateX(-300px)}}
  @keyframes b{from{transform:translateX(-200px)}to{transform:translateX(0)}}
  .p{animation:p 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes p{0%,100%{opacity:.4}50%{opacity:1}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1200" height="60" fill="url(#g)" mask="url(#m)"/>
</svg>
