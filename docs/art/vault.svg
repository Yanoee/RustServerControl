<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" role="img" aria-labelledby="t">
<title id="t">A vault door inside a shield, with backup archives sliding in while a progress ring fills</title>
<defs>
  <linearGradient id="prog" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A84FF"/><stop offset=".6" stop-color="#5E5CE6"/><stop offset="1" stop-color="#E28CFF"/></linearGradient>
  <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#64D2FF"/><stop offset="1" stop-color="#1A8FD6"/></linearGradient>
  <linearGradient id="door" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34343e"/><stop offset="1" stop-color="#22222a"/></linearGradient>
  <radialGradient id="halo"><stop offset="0" stop-color="#64D2FF" stop-opacity=".25"/><stop offset="1" stop-color="#64D2FF" stop-opacity="0"/></radialGradient>
  <g id="zip">
    <rect width="132" height="34" rx="9" fill="#26262e" stroke="#fff" stroke-opacity=".16"/>
    <rect x="10" y="8" width="18" height="18" rx="5" fill="url(#teal)"/>
    <path d="M17 11v12M21 11v12" stroke="#fff" stroke-opacity=".7" stroke-width="1.5" stroke-dasharray="2 2"/>
  </g>
</defs>
<style>
  text{font-family:"Segoe UI",Inter,Arial,sans-serif}
  .m{font-family:"Cascadia Mono",Consolas,"Courier New",monospace}
  .ring{stroke-dasharray:540;stroke-dashoffset:540;animation:fill 6s ease-in-out infinite}
  @keyframes fill{0%,10%{stroke-dashoffset:540}70%,90%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
  .dial{transform-origin:200px 166px;animation:dial 6s cubic-bezier(.4,0,.2,1) infinite}
  @keyframes dial{0%{transform:rotate(0)}20%{transform:rotate(140deg)}40%{transform:rotate(30deg)}60%{transform:rotate(250deg)}80%,100%{transform:rotate(360deg)}}
  .z1,.z2,.z3{opacity:0}
  .z1{animation:in1 6s ease-in-out infinite}.z2{animation:in1 6s ease-in-out infinite;animation-delay:.7s}.z3{animation:in1 6s ease-in-out infinite;animation-delay:1.4s}
  @keyframes in1{0%{opacity:0;transform:translateX(30px)}10%{opacity:1;transform:none}40%{opacity:1;transform:none}55%{opacity:0;transform:translateX(-90px) scale(.6)}100%{opacity:0}}
  .ok{opacity:0;animation:ok 6s ease infinite;transform-box:fill-box;transform-origin:center}
  @keyframes ok{0%,68%{opacity:0;transform:scale(.6)}74%,92%{opacity:1;transform:none}100%{opacity:0}}
  .halo{animation:breathe 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes breathe{0%,100%{transform:scale(.92)}50%{transform:scale(1.05)}}
  .bolt{animation:glow 6s ease infinite}
  @keyframes glow{0%,70%{fill:#5a5a66}76%,94%{fill:#30D158}100%{fill:#5a5a66}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.ring{stroke-dashoffset:0}.z1,.z2,.z3{opacity:1}.ok{opacity:1}}
</style>
<circle class="halo" cx="200" cy="166" r="160" fill="url(#halo)"/>

<!-- shield -->
<path d="M200 22l118 40v82c0 74-50 128-118 154C132 272 82 218 82 144V62z" fill="#1c1c22" stroke="#fff" stroke-opacity=".14" stroke-width="1.5"/>
<path d="M200 22l118 40v82c0 74-50 128-118 154C132 272 82 218 82 144V62z" fill="none" stroke="url(#prog)" stroke-opacity=".55" stroke-width="2"/>

<!-- progress ring + door -->
<circle cx="200" cy="166" r="86" fill="none" stroke="#fff" stroke-opacity=".07" stroke-width="6"/>
<circle class="ring" cx="200" cy="166" r="86" fill="none" stroke="url(#prog)" stroke-width="6" stroke-linecap="round" transform="rotate(-90 200 166)"/>
<circle cx="200" cy="166" r="72" fill="url(#door)" stroke="#fff" stroke-opacity=".16"/>
<g>
  <circle class="bolt" cx="200" cy="104" r="5" fill="#5a5a66"/><circle class="bolt" cx="262" cy="166" r="5" fill="#5a5a66"/>
  <circle class="bolt" cx="200" cy="228" r="5" fill="#5a5a66"/><circle class="bolt" cx="138" cy="166" r="5" fill="#5a5a66"/>
  <circle class="bolt" cx="244" cy="122" r="4" fill="#5a5a66"/><circle class="bolt" cx="244" cy="210" r="4" fill="#5a5a66"/>
  <circle class="bolt" cx="156" cy="210" r="4" fill="#5a5a66"/><circle class="bolt" cx="156" cy="122" r="4" fill="#5a5a66"/>
</g>
<g class="dial">
  <circle cx="200" cy="166" r="34" fill="#2c2c35" stroke="#fff" stroke-opacity=".2"/>
  <path d="M200 136v8M200 188v8M170 166h8M222 166h8M179 145l5 5M216 182l5 5M179 187l5-5M216 150l5-5" stroke="#EBEBF5" stroke-opacity=".5" stroke-width="2" stroke-linecap="round"/>
  <path d="M200 166V140" stroke="#64D2FF" stroke-width="4" stroke-linecap="round"/>
  <circle cx="200" cy="166" r="9" fill="url(#teal)"/>
</g>
<g class="ok">
  <circle cx="254" cy="232" r="18" fill="#30D158"/>
  <path d="M245 232l6 6 12-12" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- archives -->
<g class="z1"><use href="#zip" x="330" y="96"/><text x="368" y="117" font-size="10.5" class="m" fill="#F5F5F7">map.sav</text></g>
<g class="z2"><use href="#zip" x="330" y="146"/><text x="368" y="167" font-size="10.5" class="m" fill="#F5F5F7">plugins</text></g>
<g class="z3"><use href="#zip" x="330" y="196"/><text x="368" y="217" font-size="10.5" class="m" fill="#F5F5F7">config</text></g>
</svg>
